# Weekly update checks; each one still goes through CI and review before it is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-and-build:
        patterns: ["org.jetbrains.kotlin*", "com.android.*", "com.google.devtools.ksp*", "com.google.dagger*"]
